apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciler
spec:
  replicas: 1
  template:
    spec:
      containers:
        - image: "ghcr.io/thuse-course/secoder-reconciler:0.1.0"
          imagePullPolicy: IfNotPresent
          name: reconciler
          ports:
            - containerPort: 8000
              protocol: TCP
