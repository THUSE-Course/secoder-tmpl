apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
spec:
  replicas: 1
  template:
    spec:
      containers:
        - image: "ghcr.io/thuse-course/secoder-exporter:0.1.0"
          imagePullPolicy: IfNotPresent
          name: exporter
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http-metrics
