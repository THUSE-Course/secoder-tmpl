apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: secoder-core
      containers:
        - image: "localhost/backend:latest"
          imagePullPolicy: IfNotPresent
          name: backend
          ports:
            - containerPort: 8080
              name: backend
              protocol: TCP
            - containerPort: 9090
              name: http-metrics
              protocol: TCP
          volumeMounts:
            - mountPath: /srv
              name: data
            - name: config
              mountPath: /etc/config.json
              subPath: config.json
              readOnly: true
        - image: "localhost/frontend:latest"
          imagePullPolicy: IfNotPresent
          name: frontend
          ports:
            - containerPort: 80
              protocol: TCP
      volumes:
        - name: config
          configMap:
            name: backend
            items:
              - key: config.json
                path: config.json
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 1Gi
        storageClassName: nfs-retain
