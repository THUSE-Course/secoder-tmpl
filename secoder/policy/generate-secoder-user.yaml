apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: secoder-user
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: secoder
      expression: "'secoder' in object.metadata.labels"
    - name: user
      expression: object.metadata.name.startsWith('u-')
  variables:
    - name: ns
      expression: object.metadata.name
  generate:
    # Users are given smaller request quotas and larger limit quotas so the
    # cluster can accommodate more users while allowing short bursts.
    # u-* namespace quota totals: requests 128m CPU / 256Mi memory, limits
    # 2 CPU / 4Gi memory. LimitRange supplies defaults but does not enforce a
    # per-container max; ResourceQuota enforces only the namespace aggregate.
    - expression: |
        generator.Apply(string(variables.ns), [
          {
            "kind": dyn("RoleBinding"),
            "apiVersion": dyn("rbac.authorization.k8s.io/v1"),
            "metadata": dyn({
              "name": dyn(string(variables.ns) + "-edit")
            }),
            "roleRef": dyn({
              "apiGroup": dyn("rbac.authorization.k8s.io"),
              "kind": dyn("ClusterRole"),
              "name": dyn("secoder-user-edit")
            }),
            "subjects": dyn([
              {
                "kind": dyn("ServiceAccount"),
                "name": dyn("default"),
                "namespace": dyn(string(variables.ns)),
                "apiGroup": dyn("")
              }
            ])
          },
          {
            "kind": dyn("ResourceQuota"),
            "apiVersion": dyn("v1"),
            "metadata": dyn({
              "name": dyn("secoder-user-quota")
            }),
            "spec": dyn({
              "hard": dyn({
                "pods": dyn("10"),
                "requests.cpu": dyn("128m"),
                "requests.memory": dyn("256Mi"),
                "limits.cpu": dyn("2"),
                "limits.memory": dyn("4Gi"),
                "requests.storage": dyn("10Gi"),
                "persistentvolumeclaims": dyn("5"),
                "services": dyn("10"),
                "secrets": dyn("50"),
                "configmaps": dyn("50")
              })
            })
          },
          {
            "kind": dyn("LimitRange"),
            "apiVersion": dyn("v1"),
            "metadata": dyn({
              "name": dyn("secoder-default-limits")
            }),
            "spec": dyn({
              "limits": dyn([
                {
                  "type": dyn("Container"),
                  "defaultRequest": dyn({
                    "cpu": dyn("50m"),
                    "memory": dyn("100Mi")
                  }),
                  "default": dyn({
                    "cpu": dyn("1024m"),
                    "memory": dyn("4Gi")
                  })
                }
              ])
            })
          }
        ])
