apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
spec:
  rules:
    - backendRefs:
        - name: frontend
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
    - backendRefs:
        - name: backend
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /api
            filters:
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
