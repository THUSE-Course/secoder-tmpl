apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devpi
  labels:
    app.kubernetes.io/name: devpi
spec:
  serviceName: devpi
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devpi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpi
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: devpi
          image: ghcr.io/thuse-course/secoder-pypi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3141
          readinessProbe:
            httpGet:
              path: /+api
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /+api
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: devpi-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: devpi-data
      spec:
        storageClassName: nfs-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
