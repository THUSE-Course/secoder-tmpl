apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: secoder-user
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: secoder
      expression: "'secoder' in object.metadata.labels"
    - name: user
      expression: object.metadata.name.startsWith('u-')
  variables:
    - name: ns
      expression: object.metadata.name
  generate:
    - expression: |
        generator.Apply(string(variables.ns), [
          {
            "kind": dyn("RoleBinding"),
            "apiVersion": dyn("rbac.authorization.k8s.io/v1"),
            "metadata": dyn({
              "name": dyn(string(variables.ns) + "-edit")
            }),
            "roleRef": dyn({
              "apiGroup": dyn("rbac.authorization.k8s.io"),
              "kind": dyn("ClusterRole"),
              "name": dyn("secoder-user-edit")
            }),
            "subjects": dyn([
              {
                "kind": dyn("ServiceAccount"),
                "name": dyn("default"),
                "namespace": dyn(string(variables.ns)),
                "apiGroup": dyn("")
              }
            ])
          },
          {
            "kind": dyn("ResourceQuota"),
            "apiVersion": dyn("v1"),
            "metadata": dyn({
              "name": dyn("secoder-user-quota")
            }),
            "spec": dyn({
              "hard": dyn({
                "pods": dyn("10"),
                "requests.cpu": dyn("2"),
                "requests.memory": dyn("10Gi"),
                "limits.cpu": dyn("2"),
                "limits.memory": dyn("10Gi"),
                "requests.storage": dyn("10Gi"),
                "persistentvolumeclaims": dyn("5"),
                "services": dyn("10"),
                "secrets": dyn("50"),
                "configmaps": dyn("50")
              })
            })
          },
          {
            "kind": dyn("LimitRange"),
            "apiVersion": dyn("v1"),
            "metadata": dyn({
              "name": dyn("secoder-default-limits")
            }),
            "spec": dyn({
              "limits": dyn([
                {
                  "type": dyn("Container"),
                  "defaultRequest": dyn({
                    "cpu": dyn("50m"),
                    "memory": dyn("128Mi")
                  }),
                  "default": dyn({
                    "cpu": dyn("200m"),
                    "memory": dyn("256Mi")
                  }),
                  "max": dyn({
                    "cpu": dyn("1"),
                    "memory": dyn("1Gi")
                  }),
                  "maxLimitRequestRatio": dyn({
                    "cpu": dyn("4"),
                    "memory": dyn("4")
                  })
                }
              ])
            })
          }
        ])
