apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  clusterIP: None
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
      name: backend
    - port: 80
      protocol: TCP
      targetPort: 80
      name: frontend
    - port: 9090
      protocol: TCP
      targetPort: http-metrics
      name: http-metrics
