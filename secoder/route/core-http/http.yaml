apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secoder
spec:
  hostnames:
    - secoder.net
  rules:
    - backendRefs:
        - name: core
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
    - backendRefs:
        - name: core
          port: 8080
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /api
            filters:
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
